<!doctype html><html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>やさしい英単語帳 Sランク100語</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef6fb;color:#18324a;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{height:58px;background:#fff;border-bottom:1px solid #dbe7ef;display:flex;align-items:center;justify-content:space-between;padding:0 16px}
h1{font-size:18px;margin:0}.icon{border:0;background:none;font-size:22px}
main{max-width:560px;margin:auto;padding:18px 16px}.progress{text-align:center;color:#668096;font-size:14px;margin-bottom:10px}
.card{background:#fff;border-radius:22px;min-height:310px;padding:35px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 5px 18px #00000012;touch-action:pan-y;user-select:none}
.rank{font-size:13px;color:#4a90e2;margin-bottom:18px}.word{font-size:42px;font-weight:700}.answer{font-size:24px;color:#2d638f;margin-top:22px;min-height:34px}
.hint{font-size:13px;color:#8297a8;margin-top:24px}.actions{display:flex;gap:10px;margin-top:16px}
.actions button,.nav button,.sets button{border:0;border-radius:12px;padding:10px 16px;cursor:pointer}
.answerBtn{background:#4a90e2;color:#fff}.learnBtn{background:#55b97a;color:#fff}.learnBtn.off{background:#e7eef3;color:#587083}
.nav{display:flex;justify-content:space-between;margin-top:15px}.nav button{background:#fff;border:1px solid #d8e4ec;color:#23465e}
.sets{display:flex;gap:7px;justify-content:center;margin-top:14px;flex-wrap:wrap}.sets button{background:#fff;border:1px solid #d8e4ec;color:#486579}
.sets .active{background:#4a90e2;color:#fff;border-color:#4a90e2}.panel,.complete{background:#fff;border-radius:18px;padding:20px;margin-top:15px}
.panel{display:none}.panel.show{display:block}.complete{display:none;text-align:center}.complete.show{display:block}
.row{display:flex;justify-content:space-between;align-items:center;padding:15px 0;border-bottom:1px solid #edf1f4}
.switch{width:48px;height:28px;border:0;border-radius:20px;background:#cbd7df;position:relative}.switch:after{content:"";position:absolute;width:22px;height:22px;border-radius:50%;background:#fff;top:3px;left:3px;transition:.2s}.switch.on{background:#55b97a}.switch.on:after{left:23px}
.small{font-size:13px;color:#7890a0}
</style></head><body>
<header><h1>やさしい英単語帳</h1><button class="icon" id="settingsBtn">⚙️</button></header>
<main><div id="study">
<div class="progress" id="progress"></div><div class="card" id="card"><div class="rank" id="rank"></div><div class="word" id="word"></div><div class="answer" id="answer"></div><div class="hint">タップで日本語を表示</div></div>
<div class="actions"><button class="answerBtn" id="answerBtn">日本語を見る</button><button class="learnBtn" id="learnBtn">覚えた</button></div>
<div class="nav"><button id="prev">← 前へ</button><button id="next">次へ →</button></div><div class="sets" id="sets"></div></div>
<div class="complete" id="complete"><h2>よくできました！</h2><p>このセットは終了です。</p><p id="result"></p><button class="answerBtn" id="again">もう一度</button></div>
<div class="panel" id="settings"><h3>設定</h3><div class="row"><span>「覚えた」ボタン</span><button class="switch" id="learnSwitch"></button></div><div class="row"><span>正解率・点数を表示</span><button class="switch" id="scoreSwitch"></button></div><p class="small">設定はこの端末に保存されます。</p></div>
</main>
<script>
const sets=[[['I','私'],['you','あなた・あなたたち'],['he','彼'],['she','彼女'],['it','それ'],['we','私たち'],['they','彼ら・彼女ら'],['my','私の'],['your','あなたの'],['his','彼の'],['her','彼女の'],['this','これ・この'],['that','あれ・その'],['what','何・何の'],['who','誰'],['where','どこ'],['when','いつ'],['how','どのように・どう'],['am','〜です・いる'],['is','〜です・いる'],['are','〜です・いる'],['have','持っている'],['like','好き'],['go','行く'],['come','来る']],[['do','する'],['does','する'],['can','〜できる'],['want','欲しい・〜したい'],['know','知っている'],['see','見る・会う'],['look','見る'],['watch','見る'],['make','作る'],['use','使う'],['get','得る・手に入れる'],['give','与える'],['take','取る・持っていく'],['say','言う'],['tell','伝える'],['speak','話す'],['talk','話す'],['read','読む'],['write','書く'],['listen','聞く'],['hear','聞こえる'],['eat','食べる'],['drink','飲む'],['play','遊ぶ・する'],['study','勉強する']],[['learn','学ぶ'],['live','住む・生きる'],['work','働く・仕事をする'],['help','助ける'],['need','必要とする'],['love','大好き・愛する'],['open','開ける'],['close','閉める'],['put','置く'],['bring','持ってくる'],['buy','買う'],['find','見つける'],['show','見せる'],['ask','尋ねる'],['meet','会う'],['start','始める'],['stop','止める'],['try','試す'],['understand','理解する'],['think','考える・思う'],['feel','感じる'],['good','良い'],['nice','すてきな・よい'],['big','大きい'],['small','小さい']],[['new','新しい'],['old','古い・年を取った'],['young','若い'],['happy','幸せな・うれしい'],['easy','簡単な'],['hard','難しい・一生懸命に'],['hot','暑い・熱い'],['cold','寒い・冷たい'],['many','たくさんの'],['much','たくさんの'],['very','とても'],['really','本当に'],['always','いつも'],['often','よく'],['and','そして・〜と'],['but','しかし'],['or','または'],['because','なぜなら・〜なので'],['not','〜ではない'],['to','〜へ・〜するために'],['from','〜から'],['in','〜の中に・〜で'],['on','〜の上に・〜に'],['at','〜で・〜に'],['with','〜と一緒に']]];
let si=0,wi=0,revealed=false;
let showLearn=localStorage.getItem("showLearn")!=="false";
let showScore=localStorage.getItem("showScore")==="true";
let learned=JSON.parse(localStorage.getItem("learned")||"{}");
const $=x=>document.getElementById(x), key=()=>si+"-"+wi;
function render(){let x=sets[si][wi];$("progress").textContent=`Sランク セット${si+1}　${wi+1} / 25`;$("rank").textContent=`Sランク ${si*25+wi+1} / 100`;$("word").textContent=x[0];$("answer").textContent=revealed?x[1]:"";$("answerBtn").textContent=revealed?"日本語を隠す":"日本語を見る";$("learnBtn").style.display=showLearn?"inline-block":"none";$("learnBtn").textContent=learned[key()]?"✓ 覚えた":"覚えた";$("learnBtn").className="learnBtn"+(learned[key()]?"":" off");$("sets").innerHTML=sets.map((_,i)=>`<button class="${i===si?'active':''}" onclick="changeSet(${i})">セット${i+1}</button>`).join("");}
function changeSet(i){si=i;wi=0;revealed=false;$("complete").classList.remove("show");$("study").style.display="block";render()}
$("answerBtn").onclick=()=>{revealed=!revealed;render()};$("learnBtn").onclick=()=>{learned[key()]=!learned[key()];localStorage.setItem("learned",JSON.stringify(learned));render()};
$("prev").onclick=()=>{if(wi>0){wi--;revealed=false;render()}};$("next").onclick=()=>{if(wi<24){wi++;revealed=false;render()}else{$("study").style.display="none";$("complete").classList.add("show");let n=sets[si].filter((_,i)=>learned[si+"-"+i]).length;$("result").textContent=showScore?n+" / 25語 覚えた":"おつかれさまでした。"}};
$("again").onclick=()=>changeSet(si);$("settingsBtn").onclick=()=>{$("settings").classList.toggle("show")};
function sw(){ $("learnSwitch").className="switch"+(showLearn?" on":"");$("scoreSwitch").className="switch"+(showScore?" on":"")}
$("learnSwitch").onclick=()=>{showLearn=!showLearn;localStorage.setItem("showLearn",showLearn);sw();render()};$("scoreSwitch").onclick=()=>{showScore=!showScore;localStorage.setItem("showScore",showScore);sw()};
let sx=0;$("card").ontouchstart=e=>sx=e.changedTouches[0].screenX;$("card").ontouchend=e=>{let d=e.changedTouches[0].screenX-sx;if(Math.abs(d)>60)(d<0?$("next"):$("prev")).click();else{$("answerBtn").click()}};
sw();render();
</script></body></html>
