<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>やさしい英単語帳 S・A・Bランク</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef6fb;color:#18324a;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{height:58px;background:#fff;border-bottom:1px solid #dbe7ef;display:flex;align-items:center;justify-content:space-between;padding:0 16px}
h1{font-size:18px;margin:0}.icon{border:0;background:none;font-size:22px}.rank-selector{max-width:560px;margin:14px auto 0;padding:0 16px;display:flex;gap:10px}
.rank-selector button{flex:1;border:1px solid #d8e4ec;background:#fff;color:#486579;border-radius:12px;padding:12px;font-size:16px;font-weight:700}
.rank-selector button.active{background:#4a90e2;color:#fff;border-color:#4a90e2}
main{max-width:560px;margin:auto;padding:18px 16px}.progress{text-align:center;color:#668096;font-size:14px;margin-bottom:10px}
.card{background:#fff;border-radius:22px;min-height:310px;padding:35px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 5px 18px #00000012;touch-action:pan-y;user-select:none}
.rank{font-size:13px;color:#4a90e2;margin-bottom:18px}.word{font-size:42px;font-weight:700}.answer{font-size:24px;color:#2d638f;margin-top:22px;min-height:34px}
.hint{font-size:13px;color:#8297a8;margin-top:24px}.actions{display:flex;gap:10px;margin-top:16px}
.actions button,.nav button,.sets button{border:0;border-radius:12px;padding:10px 16px;cursor:pointer}
.answerBtn{background:#4a90e2;color:#fff}.learnBtn{background:#55b97a;color:#fff}.learnBtn.off{background:#e7eef3;color:#587083}
.nav{display:flex;justify-content:space-between;margin-top:15px}.nav button{background:#fff;border:1px solid #d8e4ec;color:#23465e}
.sets{display:flex;gap:7px;justify-content:center;margin-top:14px;flex-wrap:wrap}.sets button{background:#fff;border:1px solid #d8e4ec;color:#486579}
.sets .active{background:#4a90e2;color:#fff;border-color:#4a90e2}.panel,.complete{background:#fff;border-radius:18px;padding:20px;margin-top:15px}
.panel{display:none}.panel.show{display:block}.complete{display:none;text-align:center}.complete.show{display:block}
.row{display:flex;justify-content:space-between;align-items:center;padding:15px 0;border-bottom:1px solid #edf1f4}
.switch{width:48px;height:28px;border:0;border-radius:20px;background:#cbd7df;position:relative}.switch:after{content:"";position:absolute;width:22px;height:22px;border-radius:50%;background:#fff;top:3px;left:3px;transition:.2s}.switch.on{background:#55b97a}.switch.on:after{left:23px}
.small{font-size:13px;color:#7890a0}
</style></head>
<body>
<header><h1>やさしい英単語帳</h1><button class="icon" id="settingsBtn">⚙️</button></header>
<div class="rank-selector"><button id="sRankBtn">Sランク</button><button id="aRankBtn">Aランク</button><button id="bRankBtn">Bランク</button></div>
<main>
<div id="study"><div class="progress" id="progress"></div>
<div class="card" id="card"><div class="rank" id="rank"></div><div class="word" id="word"></div><div class="answer" id="answer"></div><div class="hint">タップで日本語を表示</div></div>
<div class="actions"><button class="answerBtn" id="answerBtn">日本語を見る</button><button class="learnBtn" id="learnBtn">覚えた</button></div>
<div class="nav"><button id="prev">← 前へ</button><button id="next">次へ →</button></div><div class="sets" id="sets"></div></div>
<div class="complete" id="complete"><h2>よくできました！</h2><p>このセットは終了です。</p><p id="result"></p><button class="answerBtn" id="again">もう一度</button></div>
<div class="panel" id="settings"><h3>設定</h3>
<div class="row"><span>「覚えた」ボタン</span><button class="switch" id="learnSwitch"></button></div>
<div class="row"><span>正解率・点数を表示</span><button class="switch" id="scoreSwitch"></button></div>
<p class="small">設定はこの端末に保存されます。</p></div>
</main>
<script>
const data={"S":[[["I","私"],["you","あなた・あなたたち"],["he","彼"],["she","彼女"],["it","それ"],["we","私たち"],["they","彼ら・彼女ら"],["my","私の"],["your","あなたの"],["his","彼の"],["her","彼女の・彼女を"],["this","これ・この"],["that","あれ・その"],["what","何・何の"],["who","誰"],["where","どこ"],["when","いつ"],["how","どのように・どうやって"],["am","〜です・いる"],["is","〜です・いる"],["are","〜です・いる"],["have","持っている・ある"],["like","好き"],["go","行く"],["come","来る"]],[["do","する"],["does","する"],["can","できる"],["want","欲しい・〜したい"],["know","知っている"],["see","見る・見える"],["look","見る・見える"],["watch","見る"],["make","作る"],["use","使う"],["get","得る・手に入れる"],["give","与える"],["take","取る・持っていく"],["say","言う"],["tell","伝える・話す"],["speak","話す"],["talk","話す"],["read","読む"],["write","書く"],["listen","聞く"],["hear","聞こえる"],["eat","食べる"],["drink","飲む"],["play","遊ぶ・する"],["study","勉強する"]],[["learn","学ぶ"],["live","住む・生きる"],["work","働く・仕事をする"],["help","助ける"],["need","必要とする"],["love","大好き・愛する"],["open","開ける・開く"],["close","閉める・閉じる"],["put","置く"],["bring","持ってくる"],["buy","買う"],["find","見つける"],["show","見せる"],["ask","たずねる・頼む"],["meet","会う"],["start","始める"],["stop","止める・やめる"],["try","試す"],["understand","理解する"],["think","考える・思う"],["feel","感じる"],["good","よい"],["nice","よい・すてきな"],["big","大きい"],["small","小さい"]],[["new","新しい"],["old","古い・年をとった"],["young","若い"],["happy","幸せな・うれしい"],["easy","簡単な"],["hard","難しい・かたい"],["hot","暑い・熱い"],["cold","寒い・冷たい"],["many","たくさんの"],["much","たくさんの・多くの"],["very","とても"],["really","本当に"],["always","いつも"],["often","よく・しばしば"],["and","そして"],["but","しかし"],["or","または"],["because","なぜなら・〜なので"],["not","〜でない"],["to","〜へ・〜に"],["from","〜から"],["in","〜の中に・〜で"],["on","〜の上に・〜に"],["at","〜で・〜に"],["with","〜と・〜と一緒に"]]],"A":[[["the","その・その人"],["a","1つの・ある"],["an","1つの・ある"],["these","これらの"],["those","あれらの"],["which","どちら・どの"],["whose","誰の"],["why","なぜ"],["was","〜でした・いた"],["were","〜でした・いた"],["has","持っている・ある"],["had","持っていた・あった"],["did","した"],["will","〜するでしょう"],["would","〜だろう"],["should","〜すべきだ"],["must","〜しなければならない"],["may","〜かもしれない"],["let","〜させる"],["call","呼ぶ・電話する"],["keep","保つ・ uring","〜の間に"],["around","〜の周りに・約"],["under","〜の下に"],["over","〜の上に・〜を越えて"],["near","〜の近くに"],["between","〜の間に"],["first","最初の・第一の"],["last","最後の・この前の"],["next","次の"],["best","最高の・最もよい"]]],"B":[[["about","〜について・約"],["above","〜の上に"],["across","〜を横切って"],["along","〜に沿って"],["among","〜の間で"],["behind","〜の後ろに"],["beside","〜のそばに"],["inside","〜の内側に"],["outside","〜の外側に"],["without","〜なしで"],["through","〜を通って"],["until","〜まで"],["since","〜以来・〜なので"],["than","〜より"],["as","〜として・〜のように"],["if","もし〜なら"],["while","〜している間"],["then","そのとき・それから"],["there","そこに・そこで"],["here","ここに・ここで"],["away","離れて"],["back","戻って・後ろ"],["together","一緒に"],["again","もう一度"],["already","すでに"]],[["still","まだ・それでも"],["almost","ほとんど"],["sometimes","ときどき"],["usually","ふつう・たいてい"],["never","決して〜ない"],["perhaps","たぶん"],["maybe","たぶん"],["enough","十分に・十分な"],["quite","かなり"],["soon","すぐに・まもなく"],["become","〜になる"],["believe","信じる"],["change","変える・変わる"],["continue","続ける"],["happen","起こる"],["improve","改善する・上達する"],["join","参加する・加わる"],["lose","失う・負ける"],["mean","意味する"],["pay","支払う"],["receive","受け取る"],["return","戻る・返す"],["send","送る"],["spend","費やす・過ごす"],["touch","触る"]],[["turn","回す・曲がる"],["carry","運ぶ"],["catch","捕まえる・間に合う"],["cut","切る"],["fall","落ちる・倒れる"],["grow","成長する・育つ"],["hold","持つ・開催する"],["pick","選ぶ・拾う"],["reach","届く・到着する"],["save","救う・節約する"],["share","共有する"],["throw","投げる"],["wear","身につけている"],["build","建てる"],["break","壊す・壊れる"],["borrow","借りる"],["lend","貸す"],["prepare","準備する"],["promise","約束する"],["protect","守る"],["solve","解決する"],["explain","説明する"],["invite","招待する"],["agree","賛成する・同意する"],["disagree","反対する"]],[["worry","心配する"],["exciting","わくわくする"],["excited","わくわくした"],["tired","疲れた"],["hungry","お腹がすいた"],["thirsty","のどが渇いた"],["afraid","怖がって"],["angry","怒って"],["sad","悲しい"],["glad","うれしい"],["lucky","幸運な"],["careful","注意深い"],["useful","役に立つ"],["necessary","必要な"],["possible","可能な"],["dangerous","危険な"],["safe","安全な"],["healthy","健康な"],["local","地元の"],["natural","自然の・自然な"],["modern","現代の"],["wonderful","すばらしい"],["airport","空港"],["station","駅"],["library","図書館"]],[["hospital","病院"],["museum","博物館"],["park","公園"],["store","店"],["building","建物"],["street","通り"],["road","道路"],["river","川"],["mountain","山"],["sea","海"],["island","島"],["holiday","休日・休暇"],["vacation","休暇"],["festival","祭り"],["season","季節"],["spring","春"],["summer","夏"],["autumn","秋"],["winter","冬"],["weather","天気"],["snow","雪"],["wind","風"],["sun","太陽"],["star","星"],["sky","空"]],[["air","空気"],["idea","考え・アイデア"],["story","物語"],["language","言語"],["word","単語・言葉"],["example","例"],["problem","問題"],["reason","理由"],["way","方法・道"],["school","学校"],["pencil","えんぴつ"],["desk","机"],["classroom","教室"],["uniform","制服"],["homework","宿題"],["dictionary","辞書"],["notebook","ノート"],["home","家／自宅"],["house","家"],["bedroom","寝室"],["clothes","服"],["shoe","くつ"],["shirt","シャツ"],["farm","農場"],["field","野原／畑"]]]};
let rankType=localStorage.getItem("rankType")||"S",si=0,wi=0,revealed=false;
let showLearn=localStorage.getItem("showLearn")!=="false",showScore=localStorage.getItem("showScore")==="true";
let learned=JSON.parse(localStorage.getItem("learned")||"{}");
const $=x=>document.getElementById(x);
function sets(){return data[rankType]}
function key(){return rankType+"-"+si+"-"+wi}
function render(){
 let ss=sets(),x=ss[si][wi];
 $("progress").textContent=`${rankType}ランク セット${si+1}　${wi+1} / 25`;
 $("rank").textContent=`${rankType}ランク ${si*25+wi+1} / ${rankType==="S"?100:150}`;
 $("word").textContent=x[0];$("answer").textContent=revealed?x[1]:"";
 $("answerBtn").textContent=revealed?"日本語を隠す":"日本語を見る";
 $("learnBtn").style.display=showLearn?"inline-block":"none";
 $("learnBtn").textContent=learned[key()]?"✓ 覚えた":"覚えた";
 $("learnBtn").className="learnBtn"+(learned[key()]?"":" off");
 $("sets").innerHTML=ss.map((_,i)=>`<button class="${i===si?'active':''}" onclick="changeSet(${i})">セット${i+1}</button>`).join("");
 $("sRankBtn").className=rankType==="S"?"active":"";
 $("aRankBtn").className=rankType==="A"?"active":"";
}
function changeSet(i){si=i;wi=0;revealed=false;$("complete").classList.remove("show");$("study").style.display="block";render()}
function changeRank(r){rankType=r;localStorage.setItem("rankType",r);si=0;wi=0;revealed=false;$("complete").classList.remove("show");$("study").style.display="block";render()}
$("sRankBtn").onclick=()=>changeRank("S");$("aRankBtn").onclick=()=>changeRank("A");$("bRankBtn").onclick=()=>changeRank("B");
$("answerBtn").onclick=()=>{revealed=!revealed;render()};
$("learnBtn").onclick=()=>{learned[key()]=!learned[key()];localStorage.setItem("learned",JSON.stringify(learned));render()};
$("prev").onclick=()=>{if(wi>0){wi--;revealed=false;render()}};
$("next").onclick=()=>{if(wi<24){wi++;revealed=false;render()}else{$("study").style.display="none";$("complete").classList.add("show");let n=sets()[si].filter((_,i)=>learned[rankType+"-"+si+"-"+i]).length;$("result").textContent=showScore?n+" / 25語 覚えた":"おつかれさまでした。"}};
$("again").onclick=()=>changeSet(si);
$("settingsBtn").onclick=()=>$("settings").classList.toggle("show");
function sw(){$("learnSwitch").className="switch"+(showLearn?" on":"");$("scoreSwitch").className="switch"+(showScore?" on":"")}
$("learnSwitch").onclick=()=>{showLearn=!showLearn;localStorage.setItem("showLearn",showLearn);sw();render()};
$("scoreSwitch").onclick=()=>{showScore=!showScore;localStorage.setItem("showScore",showScore);sw()};
let sx=0;$("card").ontouchstart=e=>sx=e.changedTouches[0].screenX;
$("card").ontouchend=e=>{let d=e.changedTouches[0].screenX-sx;if(Math.abs(d)>60)(d<0?$("next"):$("prev")).click();else $("answerBtn").click()};
sw();render();
</script></body></html>
